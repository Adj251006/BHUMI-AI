# =============================================================================
# Alembic Configuration — National Land Acquisition System
# =============================================================================
# The sqlalchemy.url is set dynamically in alembic/env.py from app.config,
# so the value below is a placeholder and will be overridden at runtime.
# =============================================================================

[alembic]
script_location = alembic
prepend_sys_path = .
sqlalchemy.url = postgresql://placeholder

# Migration file naming: revision ID + slug
file_template = %%(rev)s_%%(slug)s

# Timezone for migration timestamps
timezone = UTC

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
